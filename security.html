<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NHPC Admin Dashboard</title>

<style>
body{
font-family:Poppins,Arial;
background:#061b3d;
margin:0;
padding:20px;
color:white;
}

.login-box,
.dashboard{
max-width:1200px;
margin:auto;
background:white;
color:#111;
padding:25px;
border-radius:22px;
}

.dashboard{
display:none;
}

h1{
margin-top:0;
}

input{
padding:14px;
border-radius:12px;
border:1px solid #ccc;
width:100%;
margin-top:10px;
margin-bottom:15px;
font-size:15px;
}

button{
padding:14px 20px;
border:none;
border-radius:12px;
background:#0b4ea2;
color:white;
font-weight:700;
cursor:pointer;
margin-right:10px;
margin-top:8px;
}

.logout-btn{
background:#d71920;
float:right;
}

.stat{
font-size:28px;
font-weight:800;
color:#d71920;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
font-size:14px;
}

th,td{
border:1px solid #ddd;
padding:10px;
text-align:left;
}

th{
background:#0b4ea2;
color:white;
}

tr:nth-child(even){
background:#f5f5f5;
}

.search-info{
margin-top:8px;
font-size:13px;
opacity:0.7;
}

.user-info{
font-size:13px;
color:#555;
margin-bottom:10px;
}
</style>
</head>

<body>

<div class="login-box" id="loginBox">

<h1>NHPC Secure Access</h1>

<p>Authorized Gmail accounts only.</p>

<button onclick="googleLogin()">
Sign in with Google
</button>

</div>

<div class="dashboard" id="dashboard">

<button class="logout-btn" onclick="logout()">
Logout
</button>

<h1>NHPC E-Card Dashboard</h1>

<div class="user-info" id="userInfo"></div>

<p>
Total Cards Generated:
<span class="stat" id="total">0</span>
</p>

<input
id="search"
placeholder="Search Name / Phone / ID / Date"
onkeyup="renderTable()"
/>

<div class="search-info">
You can search using:
<br>
• Name
<br>
• Phone Number
<br>
• Unique ID
<br>
• Date like: 21/05/2026
</div>

<br>

<button onclick="exportCSV()">
Export CSV
</button>

<table>
<thead>
<tr>
<th>Name</th>
<th>Phone</th>
<th>Unique ID</th>
<th>Date</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>
</table>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
query,
orderBy
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

import {
getAuth,
GoogleAuthProvider,
signInWithPopup,
signOut,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

const firebaseConfig = {
apiKey: "AIzaSyCWR40lN4EFgmKttfXLIatPAzR3DnmrKH4",
authDomain: "mmi-nhpc-ecard.firebaseapp.com",
projectId: "mmi-nhpc-ecard",
storageBucket: "mmi-nhpc-ecard.firebasestorage.app",
messagingSenderId: "106508097973",
appId: "1:106508097973:web:20c48b020c63f74d24a1fc"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

const allowedAdmins = [
"aryansiddhartha03@gmail.com"
];

let rows = [];

window.googleLogin = async function(){
try{
await signInWithPopup(auth, provider);
}catch(error){
console.error(error);
alert("Google login failed. Please try again.");
}
}

window.logout = async function(){
await signOut(auth);
location.reload();
}

onAuthStateChanged(auth, async (user) => {

if(!user){
document.getElementById("loginBox").style.display = "block";
document.getElementById("dashboard").style.display = "none";
return;
}

if(!allowedAdmins.includes(user.email)){
alert("Access denied. This Gmail is not authorized.");
await signOut(auth);
return;
}

document.getElementById("loginBox").style.display = "none";
document.getElementById("dashboard").style.display = "block";
document.getElementById("userInfo").innerText = "Logged in as: " + user.email;

loadData();

});

async function loadData(){

const q = query(
collection(db, "nhpcUsers"),
orderBy("createdAt", "desc")
);

const snap = await getDocs(q);

rows = [];

snap.forEach(doc => {
rows.push(doc.data());
});

document.getElementById("total").innerText = rows.length;

renderTable();

}

window.renderTable = function(){

const search =
document.getElementById("search")
.value
.toLowerCase();

const body =
document.getElementById("tableBody");

const filtered =
rows.filter(r => {

const date =
r.createdAt?.toDate
? r.createdAt.toDate().toLocaleDateString()
: "";

const fullDate =
r.createdAt?.toDate
? r.createdAt.toDate().toLocaleString()
: "";

return (
String(r.name || "").toLowerCase().includes(search) ||
String(r.phone || "").toLowerCase().includes(search) ||
String(r.uniqueId || "").toLowerCase().includes(search) ||
date.toLowerCase().includes(search) ||
fullDate.toLowerCase().includes(search)
);

});

body.innerHTML =
filtered.map(r => {

const date =
r.createdAt?.toDate
? r.createdAt.toDate().toLocaleString()
: "";

return `
<tr>
<td>${r.name || ""}</td>
<td>${r.phone || ""}</td>
<td>${r.uniqueId || ""}</td>
<td>${date}</td>
</tr>
`;

}).join("");

}

window.exportCSV = function(){

let csv = "Name,Phone,Unique ID,Date\n";

rows.forEach(r => {

const date =
r.createdAt?.toDate
? r.createdAt.toDate().toLocaleString()
: "";

csv += `"${r.name || ""}","${r.phone || ""}","${r.uniqueId || ""}","${date}"\n`;

});

const blob = new Blob([csv], {type:"text/csv"});
const url = URL.createObjectURL(blob);

const a = document.createElement("a");
a.href = url;
a.download = "nhpc-ecard-data.csv";
a.click();

}

</script>

</body>
</html>
