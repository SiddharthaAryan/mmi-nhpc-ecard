<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NHPC Bulk E-Card Generator</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
body{
font-family:Arial,sans-serif;
background:#061b3d;
color:white;
padding:20px;
}

.box{
max-width:900px;
margin:auto;
background:white;
color:#111;
padding:25px;
border-radius:22px;
}

button,input{
padding:14px;
margin-top:10px;
border-radius:10px;
}

button{
background:#0b4ea2;
color:white;
border:none;
font-weight:bold;
cursor:pointer;
}

.status{
margin-top:20px;
font-weight:bold;
line-height:1.8;
}

.note{
background:#eef5ff;
padding:15px;
border-radius:12px;
margin-bottom:15px;
line-height:1.6;
}
</style>
</head>

<body>

<div class="box">

<h1>NHPC Bulk E-Card Generator</h1>

<div class="note">
Required column:
<b>Number / Contact Number / Phone / Mobile / WhatsApp Number</b>

<br><br>

Optional columns:
<b>Serial</b>,
<b>Name</b>

<br><br>

Bulk IDs will generate as:
<b>NHPC-MMI-000001</b>
</div>

<input type="file" id="excelFile" accept=".xlsx,.xls">

<br>

<button onclick="processExcel()">
Generate ZIP Package
</button>

<div class="status" id="status"></div>

</div>

<script>

function cleanNumber(num){
return String(num || "").replace(/\D/g,"");
}

function normalizeKey(key){
return String(key || "").toLowerCase().replace(/\s+/g,"").replace(/[^a-z0-9]/g,"");
}

function getValue(row, possibleKeys){

const normalizedRow = {};

Object.keys(row).forEach(key=>{
normalizedRow[normalizeKey(key)] = row[key];
});

for(const key of possibleKeys){

const cleanKey = normalizeKey(key);

if(
normalizedRow[cleanKey] !== undefined &&
normalizedRow[cleanKey] !== null &&
normalizedRow[cleanKey] !== ""
){
return normalizedRow[cleanKey];
}

}

return "";
}

function generateBulkId(index){
return "NHPC-MMI-" + String(index).padStart(6,"0");
}

function getVerifyUrl(id){
return "https://siddharthaaryan.github.io/mmi-nhpc-ecard/verify.html?id=" + encodeURIComponent(id);
}

function generateQRCanvas(text){

const canvas = document.createElement("canvas");

new QRious({
element: canvas,
value: text,
size: 220,
level: "M",
background: "white",
foreground: "black"
});

return canvas;
}

async function createCardImage(uniqueId){

return new Promise((resolve,reject)=>{

const frontImg = new Image();

frontImg.onload = function(){

const canvas = document.createElement("canvas");
const ctx = canvas.getContext("2d");

const cardWidth = 1200;
const cardHeight = 675;

canvas.width = cardWidth;
canvas.height = cardHeight;

ctx.drawImage(frontImg,0,0,cardWidth,cardHeight);

ctx.font = "900 34px Arial";
ctx.fillStyle = "white";
ctx.textAlign = "right";
ctx.textBaseline = "top";
ctx.shadowColor = "rgba(0,0,0,0.85)";
ctx.shadowBlur = 8;

ctx.fillText(
uniqueId,
cardWidth - 55,
42
);

ctx.shadowBlur = 0;

const qrCanvas =
generateQRCanvas(getVerifyUrl(uniqueId));

const qrSize = 150;
const qrX = cardWidth - 55 - qrSize;
const qrY = 92;

ctx.fillStyle = "white";

ctx.fillRect(
qrX - 6,
qrY - 6,
qrSize + 12,
qrSize + 12
);

ctx.drawImage(
qrCanvas,
qrX,
qrY,
qrSize,
qrSize
);

canvas.toBlob(function(blob){

if(blob){
resolve(blob);
}else{
reject(new Error("Card image generation failed"));
}

},"image/jpeg",0.92);

};

frontImg.onerror = function(){
reject(new Error("Could not load card-front.png"));
};

frontImg.src = "card-front.png";

});

}

async function processExcel(){

const fileInput = document.getElementById("excelFile");
const status = document.getElementById("status");

if(!fileInput.files.length){
alert("Please upload Excel file");
return;
}

try{

status.innerHTML = "Reading Excel...";

const file = fileInput.files[0];

const data = await file.arrayBuffer();

const workbook = XLSX.read(data);

const sheet =
workbook.Sheets[workbook.SheetNames[0]];

const rows =
XLSX.utils.sheet_to_json(sheet);

let validRows = [];
let skippedRows = [];

rows.forEach((row,index)=>{

const serial =
getValue(row, [
"Serial",
"serial",
"S No",
"S.No",
"Sr No",
"Sr"
]) || index + 1;

const name =
getValue(row, [
"Name",
"name",
"Full Name",
"Patient Name",
"Customer Name"
]) || "MMI Family Member";

const rawNumber =
getValue(row, [
"Number",
"number",
"Phone",
"phone",
"Contact",
"contact",
"Mobile",
"mobile",
"Contact Number",
"Phone Number",
"Mobile Number",
"WhatsApp Number",
"Whatsapp Number",
"WhatsApp",
"Whatsapp",
"Mob No",
"Mob",
"NUMBER",
"CONTACT"
]);

const number =
cleanNumber(rawNumber);

if(!/^[0-9]{10}$/.test(number)){

skippedRows.push({
Row:index+1,
Reason:"Invalid or missing 10-digit number",
OriginalNumber:rawNumber || ""
});

return;

}

validRows.push({
Serial:serial,
Name:name,
Number:number
});

});

if(validRows.length === 0){
alert("No valid rows found. Check your number column name.");
return;
}

status.innerHTML =
"Generating " + validRows.length + " E-cards...";

const zip = new JSZip();

const imageFolder =
zip.folder("E-Cards");

const outputRows = [];

for(let i=0;i<validRows.length;i++){

const row = validRows[i];

const uniqueId =
generateBulkId(i+1);

status.innerHTML =
"Generating Card " + (i+1) + " / " + validRows.length;

const blob =
await createCardImage(uniqueId);

const imageName =
uniqueId + ".jpg";

imageFolder.file(imageName, blob);

outputRows.push({
Serial: row.Serial,
Name: row.Name,
Number: row.Number,
UniqueID: uniqueId,
VerificationURL: getVerifyUrl(uniqueId),
ECardImage: imageName
});

}

const ws =
XLSX.utils.json_to_sheet(outputRows);

const wb =
XLSX.utils.book_new();

XLSX.utils.book_append_sheet(
wb,
ws,
"Bulk E-Cards"
);

if(skippedRows.length > 0){

const skippedWs =
XLSX.utils.json_to_sheet(skippedRows);

XLSX.utils.book_append_sheet(
wb,
skippedWs,
"Skipped Rows"
);

}

const excelBuffer =
XLSX.write(wb,{
bookType:"xlsx",
type:"array"
});

zip.file(
"NHPC-Bulk-ECard-Output.xlsx",
excelBuffer
);

status.innerHTML =
"Preparing ZIP download...";

const content =
await zip.generateAsync({
type:"blob"
});

const link =
document.createElement("a");

link.href =
URL.createObjectURL(content);

link.download =
"NHPC-Bulk-ECard-Package.zip";

link.click();

status.innerHTML =
"Done. ZIP downloaded successfully.";

}catch(error){

console.error(error);
alert(error.message || "Something went wrong.");

status.innerHTML =
"Error: " + (error.message || "Something went wrong.");

}

}

</script>

</body>
</html>
