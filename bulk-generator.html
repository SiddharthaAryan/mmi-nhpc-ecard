<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NHPC Bulk E-Card Generator</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
body{
font-family:Arial,sans-serif;
background:#061b3d;
color:white;
padding:20px;
}

.box{
max-width:900px;
margin:auto;
background:white;
color:#111;
padding:25px;
border-radius:22px;
}

button,input{
padding:14px;
margin-top:10px;
border-radius:10px;
}

button{
background:#0b4ea2;
color:white;
border:none;
font-weight:bold;
cursor:pointer;
}

.status{
margin-top:20px;
font-weight:bold;
line-height:1.8;
}

.note{
background:#eef5ff;
padding:15px;
border-radius:12px;
margin-bottom:15px;
line-height:1.6;
}
</style>
</head>

<body>

<div class="box">

<h1>NHPC Bulk E-Card Generator</h1>

<div class="note">
Required column:
<b>Number / Contact Number / Phone / Mobile / WhatsApp Number</b>

<br><br>

Optional columns:
<b>Serial</b>,
<b>Name</b>

<br><br>

Rule:
<b>One phone number = one lifetime card.</b>
<br>
If a number already exists, the old Unique ID will be reused.
<br>
New numbers get fresh globally unique NHPC-MMI IDs.
</div>

<input type="file" id="excelFile" accept=".xlsx,.xls">

<br>

<button onclick="processExcel()">
Generate ZIP Package
</button>

<div class="status" id="status"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
getFirestore,
doc,
getDoc,
runTransaction,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyCWR40lN4EFgmKttfXLIatPAzR3DnmrKH4",
authDomain: "mmi-nhpc-ecard.firebaseapp.com",
projectId: "mmi-nhpc-ecard",
storageBucket: "mmi-nhpc-ecard.firebasestorage.app",
messagingSenderId: "106508097973",
appId: "1:106508097973:web:20c48b020c63f74d24a1fc"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

function cleanNumber(num){
return String(num || "").replace(/\D/g,"");
}

function normalizeKey(key){
return String(key || "").toLowerCase().replace(/\s+/g,"").replace(/[^a-z0-9]/g,"");
}

function getValue(row, possibleKeys){

const normalizedRow = {};

Object.keys(row).forEach(key=>{
normalizedRow[normalizeKey(key)] = row[key];
});

for(const key of possibleKeys){

const cleanKey = normalizeKey(key);

if(
normalizedRow[cleanKey] !== undefined &&
normalizedRow[cleanKey] !== null &&
normalizedRow[cleanKey] !== ""
){
return normalizedRow[cleanKey];
}

}

return "";
}

function getVerifyUrl(id){
return "https://siddharthaaryan.github.io/mmi-nhpc-ecard/verify.html?id=" + encodeURIComponent(id);
}

async function getNextBulkStartingNumber(count){

const counterRef = doc(db, "nhpcCounters", "bulk");

return await runTransaction(db, async(transaction)=>{

const counterSnap = await transaction.get(counterRef);

let nextNumber = 1;

if(counterSnap.exists()){
nextNumber = Number(counterSnap.data().nextNumber || 1);
}

const startingNumber = nextNumber;

transaction.set(counterRef,{
nextNumber: nextNumber + count,
updatedAt: serverTimestamp()
},{merge:true});

return startingNumber;

});

}

async function getExistingUniqueId(phone){

const userRef = doc(db, "nhpcUsers", phone);
const userSnap = await getDoc(userRef);

if(userSnap.exists()){
return userSnap.data().uniqueId || "";
}

return "";

}

function generateQRCanvas(text){

const canvas = document.createElement("canvas");

new QRious({
element: canvas,
value: text,
size: 220,
level: "M",
background: "white",
foreground: "black"
});

return canvas;
}

async function createCardImage(uniqueId){

return new Promise((resolve,reject)=>{

const frontImg = new Image();

frontImg.onload = function(){

const canvas = document.createElement("canvas");
const ctx = canvas.getContext("2d");

const cardWidth = 1200;
const cardHeight = 675;

canvas.width = cardWidth;
canvas.height = cardHeight;

ctx.drawImage(frontImg,0,0,cardWidth,cardHeight);

ctx.font = "900 34px Arial";
ctx.fillStyle = "white";
ctx.textAlign = "right";
ctx.textBaseline = "top";
ctx.shadowColor = "rgba(0,0,0,0.85)";
ctx.shadowBlur = 8;

ctx.fillText(
uniqueId,
cardWidth - 55,
42
);

ctx.shadowBlur = 0;

const qrCanvas =
generateQRCanvas(getVerifyUrl(uniqueId));

const qrSize = 150;
const qrX = cardWidth - 55 - qrSize;
const qrY = 92;

ctx.fillStyle = "white";

ctx.fillRect(
qrX - 6,
qrY - 6,
qrSize + 12,
qrSize + 12
);

ctx.drawImage(
qrCanvas,
qrX,
qrY,
qrSize,
qrSize
);

canvas.toBlob(function(blob){

if(blob){
resolve(blob);
}else{
reject(new Error("Card image generation failed"));
}

},"image/jpeg",0.92);

};

frontImg.onerror = function(){
reject(new Error("Could not load card-front.png"));
};

frontImg.src = "card-front.png";

});

}

window.processExcel = async function(){

const fileInput = document.getElementById("excelFile");
const status = document.getElementById("status");

if(!fileInput.files.length){
alert("Please upload Excel file");
return;
}

try{

status.innerHTML = "Reading Excel...";

const file = fileInput.files[0];
const data = await file.arrayBuffer();
const workbook = XLSX.read(data);
const sheet = workbook.Sheets[workbook.SheetNames[0]];
const rows = XLSX.utils.sheet_to_json(sheet);

let validRows = [];
let skippedRows = [];
let seenNumbers = new Set();

rows.forEach((row,index)=>{

const serial =
getValue(row, [
"Serial",
"serial",
"S No",
"S.No",
"Sr No",
"Sr"
]) || index + 1;

const name =
getValue(row, [
"Name",
"name",
"Full Name",
"Patient Name",
"Customer Name"
]) || "MMI Family Member";

const rawNumber =
getValue(row, [
"Number",
"number",
"Phone",
"phone",
"Contact",
"contact",
"Mobile",
"mobile",
"Contact Number",
"Phone Number",
"Mobile Number",
"WhatsApp Number",
"Whatsapp Number",
"WhatsApp",
"Whatsapp",
"Mob No",
"Mob",
"NUMBER",
"CONTACT"
]);

const number =
cleanNumber(rawNumber);

if(!/^[0-9]{10}$/.test(number)){

skippedRows.push({
Row:index+1,
Reason:"Invalid or missing 10-digit number",
OriginalNumber:rawNumber || ""
});

return;

}

if(seenNumbers.has(number)){

skippedRows.push({
Row:index+1,
Reason:"Duplicate number inside same Excel",
OriginalNumber:number
});

return;

}

seenNumbers.add(number);

validRows.push({
Serial:serial,
Name:name,
Number:number
});

});

if(validRows.length === 0){
alert("No valid rows found. Check your number column name.");
return;
}

status.innerHTML =
"Checking existing numbers in Firebase...";

let preparedRows = [];
let newNumberCount = 0;
let reusedCount = 0;

for(let i=0;i<validRows.length;i++){

const row = validRows[i];

status.innerHTML =
"Checking number " + (i+1) + " / " + validRows.length;

const existingUniqueId =
await getExistingUniqueId(row.Number);

if(existingUniqueId){

preparedRows.push({
...row,
UniqueID: existingUniqueId,
IsExisting: true
});

reusedCount++;

}else{

preparedRows.push({
...row,
UniqueID: "",
IsExisting: false
});

newNumberCount++;

}

}

let startingNumber = null;

if(newNumberCount > 0){

status.innerHTML =
"Reserving " + newNumberCount + " new unique IDs from Firebase...";

startingNumber =
await getNextBulkStartingNumber(newNumberCount);

}

let nextNewIndex = 0;

for(let i=0;i<preparedRows.length;i++){

if(!preparedRows[i].UniqueID){

preparedRows[i].UniqueID =
"NHPC-MMI-" + String(startingNumber + nextNewIndex).padStart(6,"0");

nextNewIndex++;

}

}

status.innerHTML =
"Generating " + preparedRows.length + " E-cards..." +
"<br>Existing IDs reused: " + reusedCount +
"<br>New IDs created: " + newNumberCount;

const zip = new JSZip();

const imageFolder =
zip.folder("E-Cards");

const outputRows = [];

for(let i=0;i<preparedRows.length;i++){

const row = preparedRows[i];

const uniqueId =
row.UniqueID;

status.innerHTML =
"Generating Card " + (i+1) + " / " + preparedRows.length +
"<br>Current ID: " + uniqueId;

const blob =
await createCardImage(uniqueId);

const imageName =
uniqueId + ".jpg";

imageFolder.file(imageName, blob);

outputRows.push({
Serial: row.Serial,
Name: row.Name,
Number: row.Number,
UniqueID: uniqueId,
VerificationURL: getVerifyUrl(uniqueId),
Attachment: "E-Cards/" + imageName,
Message: "Welcome to the MMI Narayana Health Family. Your Family Privilege Card is attached. This card covers your entire family during hospital visits.",
Status: row.IsExisting ? "Existing ID reused" : "New ID generated"
});

}

const ws =
XLSX.utils.json_to_sheet(outputRows);

const wb =
XLSX.utils.book_new();

XLSX.utils.book_append_sheet(
wb,
ws,
"Bulk E-Cards"
);

if(skippedRows.length > 0){

const skippedWs =
XLSX.utils.json_to_sheet(skippedRows);

XLSX.utils.book_append_sheet(
wb,
skippedWs,
"Skipped Rows"
);

}

const excelBuffer =
XLSX.write(wb,{
bookType:"xlsx",
type:"array"
});

zip.file(
"NHPC-Bulk-ECard-Output.xlsx",
excelBuffer
);

status.innerHTML =
"Preparing ZIP download...";

const content =
await zip.generateAsync({
type:"blob"
});

const link =
document.createElement("a");

link.href =
URL.createObjectURL(content);

link.download =
"NHPC-Bulk-ECard-Package.zip";

link.click();

status.innerHTML =
"Done. ZIP downloaded successfully." +
"<br>Existing IDs reused: " + reusedCount +
"<br>New IDs created: " + newNumberCount +
"<br>Skipped rows: " + skippedRows.length;

}catch(error){

console.error(error);
alert(error.message || "Something went wrong.");

status.innerHTML =
"Error: " + (error.message || "Something went wrong.");

}

}

</script>

</body>
</html>
