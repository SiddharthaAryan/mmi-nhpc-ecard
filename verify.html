<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Verify NHPC Card</title>

<style>
body{
font-family:Arial, sans-serif;
background:#061b3d;
color:white;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.box{
max-width:500px;
width:100%;
background:white;
color:#111;
padding:30px;
border-radius:24px;
text-align:center;
box-shadow:0 20px 60px rgba(0,0,0,0.35);
}

.status{
font-size:32px;
font-weight:800;
margin-bottom:20px;
}

.valid{
color:#0f9d58;
}

.invalid{
color:#d71920;
}

.detail{
text-align:left;
margin-top:20px;
line-height:1.8;
font-size:16px;
}

.card-id{
font-weight:800;
color:#0b4ea2;
}
</style>
</head>

<body>

<div class="box">

<div id="status" class="status">
Checking...
</div>

<div id="details" class="detail"></div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
getFirestore,
collection,
query,
where,
getDocs
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyCWR40lN4EFgmKttfXLIatPAzR3DnmrKH4",
authDomain: "mmi-nhpc-ecard.firebaseapp.com",
projectId: "mmi-nhpc-ecard",
storageBucket: "mmi-nhpc-ecard.firebasestorage.app",
messagingSenderId: "106508097973",
appId: "1:106508097973:web:20c48b020c63f74d24a1fc"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const params = new URLSearchParams(window.location.search);
const cardId = params.get("id");

async function verifyCard(){

const status = document.getElementById("status");
const details = document.getElementById("details");

if(!cardId){

status.innerText = "INVALID";
status.className = "status invalid";

details.innerHTML = `
No Card ID found in the verification link.
`;

return;
}

try{

const q = query(
collection(db, "nhpcUsers"),
where("uniqueId", "==", cardId)
);

const snap = await getDocs(q);

if(snap.empty){

status.innerText = "INVALID CARD";
status.className = "status invalid";

details.innerHTML = `
This card ID was not found in the NHPC database.
<br><br>
Card ID:
<span class="card-id">${cardId}</span>
`;

return;
}

const data = snap.docs[0].data();

const date =
data.createdAt?.toDate
? data.createdAt.toDate().toLocaleString()
: "Not available";

status.innerText = "VALID CARD";
status.className = "status valid";

details.innerHTML = `
<strong>Name:</strong> ${data.name || ""}<br>
<strong>Phone:</strong> ${data.phone || ""}<br>
<strong>Card ID:</strong> <span class="card-id">${data.uniqueId || ""}</span><br>
<strong>Issued:</strong> ${date}<br>
<strong>Status:</strong> Active
`;

}catch(error){

console.error(error);

status.innerText = "ERROR";
status.className = "status invalid";

details.innerHTML = `
Could not verify card. Please try again.
`;

}

}

verifyCard();

</script>

</body>
</html>
